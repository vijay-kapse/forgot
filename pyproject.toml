[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgot"
version = "0.1.0"
description = "Name the files that usually change alongside the ones you staged."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Vijay" }]
keywords = ["git", "pre-commit", "co-change", "coupling", "code-review", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vijaysk/forgot"
Issues = "https://github.com/vijaysk/forgot/issues"

[project.scripts]
forgot = "forgot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
